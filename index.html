<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d18">
  <title>Pulse Customs — Discord</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; overflow: hidden; color: #f5f7ff; background: radial-gradient(ellipse at 50% 0%, #182b50 0%, #0b1427 42%, #070b13 100%); }
    body::before, body::after { content: ""; position: fixed; width: 420px; height: 420px; border-radius: 50%; filter: blur(100px); opacity: .17; pointer-events: none; }
    body::before { background: #4169d8; top: -230px; left: -180px; }
    body::after { background: #5268b9; bottom: -280px; right: -150px; }
    main { width: min(100%, 480px); position: relative; z-index: 1; }
    .eyebrow { display: flex; justify-content: center; align-items: center; gap: 9px; margin-bottom: 18px; color: #9aa9c7; font-size: 11px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; }
    .eyebrow::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #8ba8ff; box-shadow: 0 0 14px #7195ff; }
    .card { --mx: 0deg; --my: 0deg; position: relative; padding: 30px; border: 1px solid rgba(171,192,255,.16); border-radius: 27px; background: linear-gradient(145deg, rgba(25,39,67,.91), rgba(12,20,35,.96)); box-shadow: 0 30px 100px rgba(0,0,0,.48), inset 0 1px rgba(255,255,255,.07); transform: perspective(900px) rotateX(var(--my)) rotateY(var(--mx)); transition: transform .22s ease, border-color .25s ease, box-shadow .25s ease; overflow: hidden; }
    .card::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at var(--px,50%) var(--py,0%), rgba(128,161,255,.16), transparent 45%); opacity: .8; pointer-events: none; }
    .card:hover { border-color: rgba(171,192,255,.3); box-shadow: 0 36px 110px rgba(0,0,0,.55), 0 0 45px rgba(76,112,210,.08), inset 0 1px rgba(255,255,255,.1); }
    .topline { position: relative; display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
    .brand { display: flex; align-items: center; gap: 10px; color: #dce5ff; font-size: 12px; font-weight: 750; letter-spacing: .12em; }
    .brand-mark { width: 25px; height: 25px; display: grid; place-items: center; border-radius: 8px; color: white; background: linear-gradient(145deg,#7898ff,#405fbe); box-shadow: 0 4px 16px #4568c455; font-size: 12px; }
    .live { display: inline-flex; align-items: center; gap: 7px; padding: 7px 10px; border: 1px solid rgba(111,222,168,.16); border-radius: 999px; color: #9fe4bd; background: rgba(70,175,119,.08); font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .live-dot { width: 6px; height: 6px; border-radius: 50%; background: #72d99e; box-shadow: 0 0 10px #72d99e; }
    .server { position: relative; display: flex; align-items: center; gap: 17px; }
    .avatar-wrap { width: 76px; height: 76px; padding: 3px; flex: 0 0 auto; border-radius: 23px; background: linear-gradient(145deg,#a7bbff,#405dba 65%,#24365f); box-shadow: 0 9px 30px rgba(68,101,194,.25); }
    .avatar { width: 100%; height: 100%; display: grid; place-items: center; overflow: hidden; border-radius: 20px; background: #111c32; color: #d9e3ff; font-size: 25px; font-weight: 800; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    h1 { margin: 0 0 7px; font-size: clamp(24px, 6vw, 30px); letter-spacing: -.045em; line-height: 1.05; }
    .subtitle { margin: 0; color: #9baac7; font-size: 13px; }
    .rule { height: 1px; margin: 26px 0 20px; background: linear-gradient(90deg,transparent,rgba(170,190,239,.18),transparent); }
    .stats { position: relative; display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    .stat-label { display: block; margin-bottom: 6px; color: #8494b3; font-size: 10px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }
    .stat-value { color: #f3f6ff; font-size: 22px; font-weight: 750; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
    .online-count { display: flex; align-items: center; gap: 7px; color: #a5e8c0; font-size: 12px; }
    .online-count::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #6ed69a; }
    .join { position: relative; width: 100%; display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 27px; padding: 15px 18px; border: 0; border-radius: 13px; color: white; background: linear-gradient(105deg,#657ff0,#4966d0); box-shadow: 0 9px 24px rgba(67,94,201,.28), inset 0 1px rgba(255,255,255,.22); font: inherit; font-size: 13px; font-weight: 750; text-decoration: none; transition: transform .2s ease, filter .2s ease, box-shadow .2s ease; }
    .join:hover { transform: translateY(-2px); filter: brightness(1.08); box-shadow: 0 13px 30px rgba(67,94,201,.38), inset 0 1px rgba(255,255,255,.25); }
    .join:active { transform: translateY(0) scale(.99); }
    .join svg { width: 17px; height: 17px; }
    .foot { margin: 17px 0 0; color: #687895; font-size: 10px; text-align: center; }
    .foot span { color: #93a6d4; }
    @media (max-width: 420px) { .card { padding: 23px; border-radius: 23px; } .avatar-wrap { width: 66px; height: 66px; border-radius: 20px; } .avatar { border-radius: 17px; } .server { gap: 14px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; } .card { transform: none !important; } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Join the community</div>
    <section class="card" id="invite-card" aria-label="Pulse Customs Discord invite">
      <div class="topline">
        <div class="brand"><span class="brand-mark">P</span> PULSE CUSTOMS</div>
        <div class="live"><span class="live-dot"></span> Live server</div>
      </div>
      <div class="server">
        <div class="avatar-wrap"><div class="avatar" id="server-avatar">P</div></div>
        <div>
          <h1 id="server-name">Pulse Customs</h1>
          <p class="subtitle">Your community starts here.</p>
        </div>
      </div>
      <div class="rule"></div>
      <div class="stats">
        <div><span class="stat-label">Members</span><strong class="stat-value" id="member-count">—</strong></div>
        <div><span class="stat-label">Server status</span><div class="online-count" id="server-status">Checking live data</div></div>
      </div>
      <a class="join" href="https://discord.gg/pulsecustoms" target="_blank" rel="noopener noreferrer">
        Join the Discord
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </section>
    <p class="foot">A place to connect, create and <span>build together.</span></p>
  </main>
  <script>
    (() => {
      const inviteCode = 'pulsecustoms';
      const count = document.getElementById('member-count');
      const status = document.getElementById('server-status');
      const name = document.getElementById('server-name');
      const avatar = document.getElementById('server-avatar');
      const card = document.getElementById('invite-card');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      async function refreshServer() {
        try {
          const response = await fetch('https://discord.com/api/v10/invites/' + inviteCode + '?with_counts=true', { cache: 'no-store' });
          if (!response.ok) throw new Error('Invite data unavailable');
          const data = await response.json();
          if (data.guild) {
            name.textContent = data.guild.name || 'Pulse Customs';
            if (data.guild.icon) {
              const image = document.createElement('img');
              image.src = 'https://cdn.discordapp.com/icons/' + data.guild.id + '/' + data.guild.icon + '.png?size=256';
              image.alt = '';
              image.onerror = () => { avatar.textContent = 'P'; };
              avatar.replaceChildren(image);
            }
          }
          if (Number.isFinite(data.approximate_member_count)) {
            count.textContent = data.approximate_member_count.toLocaleString();
            status.textContent = 'Invite active';
          } else {
            count.textContent = '—';
            status.textContent = 'Count unavailable';
          }
        } catch {
          status.textContent = 'Live data unavailable';
        }
      }

      refreshServer();
      window.setInterval(refreshServer, 5000);

      if (!reducedMotion && window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
        card.addEventListener('pointermove', event => {
          const rect = card.getBoundingClientRect();
          const x = (event.clientX - rect.left) / rect.width;
          const y = (event.clientY - rect.top) / rect.height;
          card.style.setProperty('--px', (x * 100) + '%');
          card.style.setProperty('--py', (y * 100) + '%');
          card.style.setProperty('--mx', ((x - .5) * 3.2) + 'deg');
          card.style.setProperty('--my', ((.5 - y) * 3.2) + 'deg');
        });
        card.addEventListener('pointerleave', () => {
          card.style.setProperty('--mx', '0deg');
          card.style.setProperty('--my', '0deg');
          card.style.setProperty('--px', '50%');
          card.style.setProperty('--py', '0%');
        });
      }
    })();
  </script>
</body>
</html>
